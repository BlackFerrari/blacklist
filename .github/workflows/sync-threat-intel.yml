name: Threat Intel Auto-Sync (Every 5 Minutes)

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:      # Allows manual trigger in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run threat intelligence synchronizer
        run: python sync_threat_intel.py

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "threat-intel-bot@users.noreply.github.com"
          git config --local user.name "Threat Intel Synchronizer"
          git add blacklist.txt feeds.json blacklist-dates.json user-ips.json
          git diff --staged --quiet || (git commit -m "Automated 5-minute threat intel sync" && git push)
